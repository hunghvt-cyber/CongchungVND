<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ôn thi tập sự hành nghề công chứng 2027" />
  <title>Ôn thi Công chứng 2027</title>
  <link rel="stylesheet" href="./styles.css?v=feedback1" />
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="./">Ôn thi Công chứng 2027</a><span class="badge">MVP</span></div></header>
  <main class="container">
    <section class="hero"><p class="eyebrow">Ôn thi công chứng</p><h1>Học và thi trắc nghiệm</h1><p class="lead">Hai chế độ đơn giản: Ôn tập để học từng câu và Thi thử để mô phỏng bài thi.</p></section>

    <section class="mode-grid" aria-label="Chọn chế độ">
      <button id="practiceMode" class="mode-card"><span class="mode-icon">📖</span><span class="card-number">CHẾ ĐỘ 1</span><h2>Ôn tập</h2><p>Xem đúng/sai, đáp án, giải thích và căn cứ pháp lý ngay sau mỗi câu.</p><span class="card-action">Bắt đầu ôn →</span></button>
      <button id="mockMode" class="mode-card"><span class="mode-icon">📝</span><span class="card-number">CHẾ ĐỘ 2</span><h2>Thi thử</h2><p>Sinh mã đề, giới hạn thời gian và chỉ xem đáp án sau khi nộp bài.</p><span class="card-action">Bắt đầu thi →</span></button>
    </section>

    <section id="setup" class="setup-panel hidden"></section>
    <section id="quiz" class="quiz-panel hidden" aria-live="polite">
      <div class="quiz-topbar"><div><span id="quizMode" class="eyebrow"></span><h2 id="quizTitle">Bài kiểm tra</h2></div><div class="quiz-meta"><span id="examCode"></span><span id="timer"></span><button id="exitQuiz" class="icon-button" aria-label="Thoát">×</button></div></div>
      <div class="progress-wrap"><div class="progress-label"><span id="progressText"></span><span id="scoreText"></span></div><div class="progress"><div id="progressBar"></div></div></div>
      <div id="examShare" class="hidden"></div>
      <div id="questionArea"></div>
      <div class="quiz-actions"><button id="prevQuestion" class="secondary-button">← Câu trước</button><button id="nextQuestion" class="primary-button">Trả lời & tiếp →</button></div>
    </section>
    <section id="result" class="result-panel hidden"></section>
  </main>
  <footer class="site-footer"><div class="container">Ngân hàng câu hỏi sẽ được bổ sung và kiểm chứng dần.</div></footer>
  <script type="module" src="./app.js?v=feedback1"></script>
</body>
</html>
